name: CLI CI Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout CLI repository
        uses: actions/checkout@v4

      - name: Checkout SDK repository
        uses: actions/checkout@v4
        with:
          repository: SoroDoc-Labs/sorodoc-sdk
          path: sorodoc-sdk

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build SDK
        run: |
          cd sorodoc-sdk
          npm ci
          npm run build

      - name: Install CLI dependencies
        run: npm ci

      - name: Run CLI TypeScript typecheck
        run: npm run typecheck

      - name: Run CLI Vitest test suite
        run: npm run test

      - name: Run CLI package build
        run: npm run build
